title: AWS root account console login
id: 4b167562-6dad-5d46-b0d3-8c9d6e4190b3
name: cld_001
status: experimental
description: "The root user should only be used for a handful of account-level tasks. Any root login needs review."
author: Xiome West
date: 2026-11-21
references:
    - https://attack.mitre.org/techniques/T1078/004/
tags:
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    sel:
        eventName: "ConsoleLogin"
        userIdentity.type: "Root"
    condition: sel
falsepositives:
    - "Documented break-glass use (verify against change ticket)"
level: high

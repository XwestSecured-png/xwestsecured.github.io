title: Burst of AccessDenied errors from one principal (cloud discovery) (correlation)
id: 8313fc67-7a82-52d1-9e59-0f6c8f990447
status: experimental
correlation:
    type: event_count
    rules:
        - cld_009
    group-by:
        - userIdentity.arn
    timespan: 10m
    condition:
        gte: 10
level: medium

name: westguard CI
on:
  push:
    paths: ["toolkit/**", ".github/workflows/westguard-ci.yml"]
  pull_request:
    paths: ["toolkit/**"]
permissions:
  contents: read
defaults:
  run:
    working-directory: toolkit
jobs:
  test:
    runs-on: ubuntu-24.04          # pinned: newer images no longer ship Python 3.9 (EOL), which we still support
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Unit and end-to-end tests (stdlib only)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Tests with optional extras
        if: matrix.python == '3.12'
        run: pip install yara-python stix2 pysigma pysigma-backend-splunk && PYTHONPATH=src python -m unittest discover -s tests
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install bandit
      - name: Static security analysis (sample data with intentional fake secrets excluded)
        run: bandit -r src -ll -x src/westguard/data/samples
  package:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build sdist and wheel
        run: pip install build && python -m build
      - name: Install the wheel in a clean venv and run the demo smoke test
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/westguard doctor && /tmp/v/bin/westguard demo --out /tmp/demo
      - uses: actions/upload-artifact@v4
        with: { name: westguard-dist, path: toolkit/dist/ }
  docker:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Build image
        run: docker build -t westguard:ci .
      - name: Smoke test as non-root
        run: |
          docker run --rm westguard:ci version
          docker run --rm --read-only --tmpfs /tmp westguard:ci demo --out /tmp/demo
          test "$(docker run --rm --entrypoint id westguard:ci -u)" = "10001"
